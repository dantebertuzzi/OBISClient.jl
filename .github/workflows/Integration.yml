name: Integration

# The checks that need the outside world: the live OBIS API, and every URL the package
# shows a reader. Both run weekly and on request, never on every push, so the package does
# not generate unnecessary load on a service that publishes no request quota.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live API check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # In a temporary environment rather than the project's, so the export reader — which
      # lives in a package extension — is exercised without DuckDB becoming a dependency of
      # OBISClient.jl or the repository's Project.toml being edited by the run.
      - name: Run integration tests
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.develop(PackageSpec(path = "."))
            Pkg.add(["DuckDB", "Tables"])
            Pkg.instantiate()
            include("test/integration/runtests.jl")'

  links:
    # The unit suite never leaves the machine, so a link that rots in the README, the
    # manual, a docstring or the CITATION files is invisible to it. Retried as a whole: a
    # runner that cannot reach one host for a minute is not a broken link.
    name: Documentation and run-time links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Check links
        run: |
          for attempt in 1 2 3; do
            julia --project=. test/links/runtests.jl && exit 0
            echo "Attempt $attempt failed; waiting before retrying..."
            sleep 30
          done
          exit 1
